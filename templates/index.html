<!DOCTYPE html>
<html>
<head>
    <title>Concerto Artikelabfrage</title>
</head>
<body>
    <h2>Artikelnummern eingeben (eine pro Zeile)</h2>

    <form action="/form" method="post">
        <textarea name="artikelnummern" rows="10" cols="50" placeholder="z.B. ZIL-00004&#10;ZIK-00004" required></textarea><br><br>
        <input type="submit" value="Abfrage starten">
    </form>

    {% if download_link %}
        <p>✅ Fertig! <a href="{{ download_link }}">Excel herunterladen</a></p>
    {% endif %}

    <br><br>
    <form action="/logout" method="get">
        <button type="submit">Logout</button>
    </form>
</body>
</html>
