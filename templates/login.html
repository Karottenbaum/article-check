<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>
    <h2>🔐 Zugriff geschützt</h2>
    <form method="post">
        <label for="password">Passwort:</label>
        <input type="password" name="password" required>
        <button type="submit">Login</button>
    </form>
    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
</body>
</html>
