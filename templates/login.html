<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>
    <h2>🔒 Passwortgeschützter Zugang</h2>
    <form method="post">
        <input type="password" name="password" placeholder="Passwort" required>
        <button type="submit">Login</button>
    </form>
    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
</body>
</html>
